# .cnb.yml
main:
  push:
    - imports:
      - https://cnb.cool/MornZe-Dev/secrets/-/blob/main/github.yml
    - stages:
        - name: sync to github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/NingZeStudio/LogShare.git
            auth_type: https
            username: qitry
            password: ${GITHUB_TOKEN}