probe/cnb-dind:
  push:
    - services:
        - docker
      docker:
        image: docker:27-cli
      stages:
        - name: 探测容器 IP 连通性
          script: |
            docker run -d --name probe-redis redis:7.4-alpine
            docker run -d --name probe-mariadb \
              -e MARIADB_DATABASE=logshare -e MARIADB_USER=logshare \
              -e MARIADB_PASSWORD=logshare -e MARIADB_ROOT_PASSWORD=root \
              mariadb:11.8
            sleep 25
            RIP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' probe-redis)
            MIP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' probe-mariadb)
            echo "redis_ip=$RIP mariadb_ip=$MIP"
            # 本机网关（docker0 的宿主侧）是否可达
            echo "--- 默认网关 ---"
            ip route
            GW=$(ip route | awk '/default/ {print $3}')
            echo "default_gw=$GW"
            echo "--- 直连容器 IP ---"
            (timeout 5 bash -c "echo > /dev/tcp/$RIP/6379" && echo "redis $RIP:6379 可达") || echo "redis $RIP:6379 不可达"
            (timeout 5 bash -c "echo > /dev/tcp/$MIP/3306" && echo "mariadb $MIP:3306 可达") || echo "mariadb $MIP:3306 不可达"
            echo "--- 探测完成 ---"
