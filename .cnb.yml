probe/cnb-dind:
  push:
    - services:
        - docker
      docker:
        image: docker:27-cli
      stages:
        - name: 用真实客户端验证 dind 内网络
          script: |
            set -x
            docker network create probe-net2 2>/dev/null || true
            docker rm -f r2 m2 2>/dev/null || true
            docker run -d --name r2 --network probe-net2 redis:7.4-alpine
            docker run -d --name m2 --network probe-net2 \
              -e MARIADB_DATABASE=logshare -e MARIADB_USER=logshare \
              -e MARIADB_PASSWORD=logshare -e MARIADB_ROOT_PASSWORD=root \
              mariadb:11.8
            sleep 22
            docker ps --format '{{.Names}} {{.Status}}'

            echo "=== A: 同一自定义网络，用 redis-cli 连服务名 ==="
            docker run --rm --network probe-net2 redis:7.4-alpine \
              redis-cli -h r2 ping
            echo "=== A2: 同一自定义网络，MariaDB 客户端连服务名 ==="
            docker run --rm --network probe-net2 mariadb:11.8 \
              mariadb -h m2 -uroot -proot -e "SELECT 'mariadb ok' AS r;"

            echo "=== B: 测试容器 --network container: 共享服务容器网络 ==="
            docker run --rm --network container:r2 redis:7.4-alpine redis-cli -h 127.0.0.1 ping

            echo "=== C: 服务容器端口发布到 dind 后，测试容器用 host 网关 ==="
            docker rm -f r3 2>/dev/null || true
            docker run -d --name r3 -p 6380:6379 redis:7.4-alpine
            sleep 4
            docker run --rm --network host redis:7.4-alpine redis-cli -h 127.0.0.1 -p 6380 ping
            echo "=== 探测完成 ==="
