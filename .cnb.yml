probe/cnb-dind:
  push:
    - services:
        - docker
      stages:
        # 1) 构建 PHP 镜像（用 dind 内 docker build 验证 Dockerfile 可用）
        - name: 构建 CI 镜像
          script: |
            set -euo pipefail
            docker build -t logshare-ci-probe -f .cnb/Dockerfile.ci .
        # 2) 起服务 + 用镜像跑 composer install 与 pest
        - name: 跑通依赖安装与单测
          script: |
            set -euo pipefail
            docker network create probe-net3 2>/dev/null || true
            docker rm -f p-mariadb p-redis 2>/dev/null || true
            docker run -d --name p-mariadb --network probe-net3 \
              -e MARIADB_DATABASE=logshare -e MARIADB_USER=logshare \
              -e MARIADB_PASSWORD=logshare -e MARIADB_ROOT_PASSWORD=root mariadb:11.8
            docker run -d --name p-redis --network probe-net3 redis:7.4-alpine
            for i in $(seq 1 60); do
              docker exec p-mariadb healthcheck.sh --connect --innodb_initialized >/dev/null 2>&1 && break
              [ "$i" = 60 ] && { docker logs p-mariadb; exit 1; }
              sleep 2
            done
            docker exec p-redis redis-cli ping

            docker run --rm --network probe-net3 \
              -v "$CNB_BUILD_WORKSPACE:/app" -w /app \
              -e DB_HOST=p-mariadb -e DB_PORT=3306 -e DB_DATABASE=logshare \
              -e DB_USERNAME=logshare -e DB_PASSWORD=logshare \
              -e REDIS_HOST=p-redis -e REDIS_PORT=6379 \
              logshare-ci-probe \
              sh -c 'php -v && php -m | grep -iE "swoole|redis|pdo_mysql|pcov|brotli" && composer install --prefer-dist --no-progress --no-interaction && cp Config.inc.example.php Config.inc.php && php vendor/bin/pest --filter=FilterTest'
            echo "=== 探测完成 ==="
