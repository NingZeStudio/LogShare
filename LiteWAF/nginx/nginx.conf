# nginx.conf — LiteWAF 随附的 OpenResty 主配置
# 基于 openresty/docker-openresty 镜像内置 nginx.conf，新增 LiteWAF 所需的
# http 级指令。挂载目标：/usr/local/openresty/nginx/conf/nginx.conf

worker_processes  auto;

# 启用 PCRE JIT，加速 ngx.re 规则匹配
pcre_jit  on;

#error_log  logs/error.log  notice;

events {
    # SSE 长连接 + 反代场景下每个客户端可能占用多条连接，1024 偏紧
    worker_connections  4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ── LiteWAF ─────────────────────────────────────────────
    # Lua 模块搜索路径：LiteWAF/lua 挂载到 /usr/local/openresty/nginx/lua
    lua_package_path '/usr/local/openresty/nginx/lua/?.lua;;';
    # 计数 / 限流 / 封禁共用 shared dict（全 worker 共享，16m 约可容纳数十万键）
    lua_shared_dict litewaf 16m;
    init_by_lua_block {
        require("litewaf").init()
    }
    # ─────────────────────────────────────────────────────────

    # 可写路径（docker-openresty 默认值）
    client_body_temp_path  /var/run/openresty/nginx-client-body;
    proxy_temp_path        /var/run/openresty/nginx-proxy;
    fastcgi_temp_path      /var/run/openresty/nginx-fastcgi;
    uwsgi_temp_path        /var/run/openresty/nginx-uwsgi;
    scgi_temp_path         /var/run/openresty/nginx-scgi;

    sendfile           on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
