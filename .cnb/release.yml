# .cnb/release.yml — Release 发布流水线
#
# 触发时机：main 分支 push 且提交信息以 [Build] 开头。
# 与原 GitHub Actions 的 release job 一致 —— tag 与 Release notes 均取自
# CHANGELOG.md 的最新版本条目，而不是从提交信息里解析版本号。
#
# 门控写在 Stage 的 `if` 上而非事件层：CNB 没有 Pipeline 级条件判断，
# 而 `git:release` 一旦执行就会真的建 Release，误触发代价高。
#
# Stage 级 `if` 的语义是「脚本退出码为 0 才执行该 Stage」，因此判据写成
# if/else 形式而不是简单的短路表达式。

.release-pipeline: &release-pipeline
  name: Release
  docker:
    # 只需 bash/awk 解析 CHANGELOG，不需要 PHP 运行时
    image: docker:27-cli
  stages:
    - name: 生成 Release 元数据
      # 非 push 事件（手动触发）直接放行；push 事件要求标题以 [Build] 开头。
      # 注意不能写成 ${VAR#[Build]}：`[Build]` 里的方括号会被当成 glob 字符类，
      # 剥离的是单个字符，判据会恒为真 —— 必须用 case 做字面前缀匹配。
      if: |
        if [ "$CNB_EVENT" != "push" ]; then exit 0; fi
        case "$CNB_COMMIT_MESSAGE_TITLE" in
          "[Build]"*) exit 0 ;;
          *) echo "提交信息不以 [Build] 开头，跳过发布"; exit 1 ;;
        esac
      script: |
        set -euo pipefail
        # 取 CHANGELOG 首条 `## x.y.z — date` 的版本号
        VER=$(grep -m1 '^## ' CHANGELOG.md | sed 's/^## //; s/ .*//')
        if [ -z "$VER" ]; then
          echo "CHANGELOG.md 未找到版本条目"; exit 1
        fi
        echo "解析到版本号: $VER"
        # Release notes 取首条版本到第二条版本之间的正文
        awk 'BEGIN{s=0} /^## /{if(s) exit; s=1; next} s{print}' CHANGELOG.md > RELEASE_NOTES.md
        if [ ! -s RELEASE_NOTES.md ]; then
          echo "Release notes 为空"; exit 1
        fi
        head -n 5 RELEASE_NOTES.md
        echo "##[set-output tag=v${VER}]"
      exports:
        tag: RELEASE_TAG
      # exports 的生命周期是当前 Pipeline，后续 Stage 可直接用 $RELEASE_TAG

    - name: 发布 Release
      type: git:release
      options:
        tag: $RELEASE_TAG
        title: LogShare $RELEASE_TAG
        descriptionFromFile: RELEASE_NOTES.md

probe/cnb-dind:
  push:
    - *release-pipeline
