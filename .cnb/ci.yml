# .cnb/ci.yml — LogShare CI 主流水线
#
# 单测（含覆盖率）、composer 校验、静态分析、架构测试、Swoole 常驻进程启动冒烟。
# 依赖服务用 dind 自行拉起，测试在加入同一自定义网络的容器内执行 ——
# 之所以不能直接在流水线容器里跑 PHP，见 .cnb.yml 顶部「平台机制约束」。

# 构建环境：仓库内 Dockerfile 构建 CI 镜像；vendor 依赖走节点缓存。
.ci-docker: &ci-docker
  build:
    dockerfile: .cnb/Dockerfile.ci
    # by 决定镜像版本哈希，Dockerfile 自身变更即触发重建
    by:
      - .cnb/Dockerfile.ci
  volumes:
    - /root/.composer/cache:copy-on-write

# 拉起 MariaDB / Redis 并等待就绪。CI 与 E2E 都要用，故独立成 Stage 片段。
.start-services:
  name: 启动依赖服务（MariaDB / Redis）
  script: |
    set -euo pipefail
    docker network create logshare-ci 2>/dev/null || true
    docker rm -f mariadb redis 2>/dev/null || true

    docker run -d --name mariadb --network logshare-ci \
      -e MARIADB_DATABASE=logshare \
      -e MARIADB_USER=logshare \
      -e MARIADB_PASSWORD=logshare \
      -e MARIADB_ROOT_PASSWORD=root \
      mariadb:11.8
    docker run -d --name redis --network logshare-ci redis:7.4-alpine

    # healthcheck.sh 是 mariadb 镜像自带的探针，比端口探测更可靠
    for i in $(seq 1 60); do
      if docker exec mariadb healthcheck.sh --connect --innodb_initialized >/dev/null 2>&1; then
        echo "MariaDB 就绪"; break
      fi
      if [ "$i" = "60" ]; then echo "MariaDB 启动超时"; docker logs mariadb; exit 1; fi
      sleep 2
    done

    for i in $(seq 1 30); do
      if docker exec redis redis-cli ping 2>/dev/null | grep -q PONG; then
        echo "Redis 就绪"; break
      fi
      if [ "$i" = "30" ]; then echo "Redis 启动超时"; docker logs redis; exit 1; fi
      sleep 2
    done

.cleanup-services:
  name: 清理依赖服务
  script: |
    set -euo pipefail
    docker rm -f mariadb redis 2>/dev/null || true
    docker network rm logshare-ci 2>/dev/null || true

.ci-pipeline:
  name: CI
  services:
    - docker
  docker: !reference [.ci-docker]
  stages:
    # 镜像 tag 与 env-file 写在 ${CNB_BUILD_WORKSPACE} 下，供后续 Stage 读取
    - name: 准备构建环境
      script: |
        set -euo pipefail
        docker build -t "logshare-ci:${CNB_BUILD_ID}" -f .cnb/Dockerfile.ci .
        printf 'logshare-ci:%s' "$CNB_BUILD_ID" > .ci-image

        # 依赖服务地址：容器名靠自定义网络解析，不是 127.0.0.1
        cat > .ci-env <<'ENVEOF'
        DB_HOST=mariadb
        DB_PORT=3306
        DB_DATABASE=logshare
        DB_USERNAME=logshare
        DB_PASSWORD=logshare
        REDIS_HOST=redis
        REDIS_PORT=6379
        ADMIN_ENABLED=true
        ADMIN_TOKEN=ci-test-token
        ENVEOF

    - name: composer 校验与代码风格
      script: |
        set -euo pipefail
        docker run --rm -v "$CNB_BUILD_WORKSPACE:/app" -w /app \
          "$(cat .ci-image)" sh -lc '
            set -e
            composer validate --strict
            # 仓库内不允许制表符缩进（YAML / PHP / Shell 一律空格）
            if git grep -nIP "^\t" -- ":!vendor" ":!*.lock"; then
              echo "发现制表符缩进，请改为空格"; exit 1
            fi
            echo "校验通过"
          '

    - !reference [.start-services]

    - name: 安装依赖
      script: |
        set -euo pipefail
        docker run --rm --network logshare-ci \
          -v "$CNB_BUILD_WORKSPACE:/app" -w /app \
          "$(cat .ci-image)" sh -lc '
            set -e
            composer install --prefer-dist --no-progress --no-interaction
            cp Config.inc.example.php Config.inc.php
          '

    - name: 初始化 MariaDB 表结构与事件
      script: |
        set -euo pipefail
        # sync_mariadb_events.php 以 Config.inc.php 为 TTL 唯一来源生成 SQL；
        # 事件必须存在且启用，否则存储层的事件断言用例会失败
        docker run --rm --network logshare-ci \
          -v "$CNB_BUILD_WORKSPACE:/app" -w /app \
          --env-file .ci-env \
          "$(cat .ci-image)" sh -lc '
            set -e
            php scripts/sync_mariadb_events.php
            php -r "
              \$pdo = new PDO(\"mysql:host=\" . getenv(\"DB_HOST\") . \";dbname=logshare\", \"root\", \"root\", [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
              \$pdo->exec(file_get_contents(\"docker/mariadb-init.sql\"));
              \$pdo->exec(file_get_contents(\"docker/mariadb-events.sql\"));
              echo \"schema and events initialized\n\";
            "
          '

    - name: 单元测试与覆盖率
      script: |
        set -euo pipefail
        # 同时产出 clover（历史产物，供 Verify 断言）与 lcov（testing:coverage
        # 任务只认 lcov / json / jacoco / golang 这几种格式，clover 不在其列）
        docker run --rm --network logshare-ci \
          -v "$CNB_BUILD_WORKSPACE:/app" -w /app \
          --env-file .ci-env \
          "$(cat .ci-image)" sh -lc '
            set -e
            php vendor/bin/pest --coverage \
              --coverage-clover=coverage/clover.xml \
              --coverage-lcov --coverage-lcov="coverage/lcov.info"
            test -s coverage/clover.xml
            test -s coverage/lcov.info
          '

    - name: 上报覆盖率
      type: testing:coverage
      options:
        pattern: coverage/lcov.info
        # 取不到报告时不中断流水线，避免覆盖率基建问题阻塞真实回归
        breakIfNoCoverage: false

    - name: 静态分析（PHPStan level 5）
      script: |
        set -euo pipefail
        docker run --rm -v "$CNB_BUILD_WORKSPACE:/app" -w /app \
          "$(cat .ci-image)" sh -lc 'set -e; composer stan'

    - name: 架构测试
      script: |
        set -euo pipefail
        docker run --rm -v "$CNB_BUILD_WORKSPACE:/app" -w /app \
          "$(cat .ci-image)" sh -lc 'set -e; composer test:architecture'

    - name: 启动冒烟测试（Swoole 常驻进程）
      script: |
        set -euo pipefail
        docker run --rm --network logshare-ci \
          -v "$CNB_BUILD_WORKSPACE:/app" -w /app \
          --env-file .ci-env \
          "$(cat .ci-image)" sh -lc '
            set -e
            # 注解扫描是否可用：路由注册失败时 list 不会报错，但 start 会
            php bin/hyperf.php list > /dev/null
            php bin/hyperf.php start > /tmp/hyperf.log 2>&1 &
            ready=0
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:9501/v1/limits > /dev/null; then ready=1; break; fi
              sleep 2
            done
            if [ "$ready" != "1" ]; then
              echo "=== 服务启动超时 ==="; cat /tmp/hyperf.log; exit 1
            fi
            php scripts/ci_e2e_test.php --base-url=http://127.0.0.1:9501 --admin-token=ci-test-token || {
              echo "=== hyperf.log ==="; cat /tmp/hyperf.log; exit 1
            }
          '

    - !reference [.cleanup-services]
  # stages 失败会跳过其后任务，统一在 endStages 兜底清理，避免残留容器
  endStages:
    - !reference [.cleanup-services]
