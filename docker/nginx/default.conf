server {
    listen 80;
    server_name _;

    # OpenLiteWaf：访问阶段检查（CC 限流 + 攻击特征），白名单/统计页跳过逻辑在 OpenLiteWaf/lua/openlitewaf.lua
    access_by_lua_file /usr/local/openresty/nginx/lua/waf.lua;
    # OpenLiteStats：log 阶段记录通过 WAF 的请求（详见 OpenLiteStats/README.md）
    log_by_lua_file /usr/local/openresty/nginx/lstats/log.lua;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

limit_req_zone $binary_remote_addr zone=logshare_api:10m rate=30r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name api.test.logshare.cn;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/api.test.logshare.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.test.logshare.cn/privkey.pem;
    # TLS 加固：钉住协议版本；会话缓存减少完整握手开销
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    client_max_body_size 210m;
    client_body_timeout 30s;
    send_timeout 300s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # OpenLiteWaf：访问阶段检查（CC 限流 + 攻击特征）
    access_by_lua_file /usr/local/openresty/nginx/lua/waf.lua;
    # OpenLiteStats：log 阶段记录通过 WAF 的请求
    log_by_lua_file /usr/local/openresty/nginx/lstats/log.lua;

    # OpenLiteStats 站点访问统计页（HTML：/stats，JSON：/stats/data）
    location = /stats {
        content_by_lua_file /usr/local/openresty/nginx/lstats/view.lua;
    }

    location = /stats/data {
        content_by_lua_file /usr/local/openresty/nginx/lstats/view.lua;
    }

    # OpenLiteWaf 公开安全统计页（HTML：/security，JSON：/security/stats）
    location = /security {
        content_by_lua_file /usr/local/openresty/nginx/lua/stats.lua;
    }

    location = /security/stats {
        content_by_lua_file /usr/local/openresty/nginx/lua/stats.lua;
    }

    # OpenLiteWaf 攻击日志分页 JSON（每页 50 条，?page=N）
    location = /security/logs {
        content_by_lua_file /usr/local/openresty/nginx/lua/stats.lua;
    }

    # 临时诊断端点（用后删除）
    location = /waf-diag {
        content_by_lua_file /usr/local/openresty/nginx/lua/diag.lua;
    }

    # 手输 /security/（带尾斜杠）时统一跳转到统计页
    location = /security/ {
        return 301 /security;
    }

    location / {
        limit_req zone=logshare_api burst=60 nodelay;
        # upstream 名经变量转发 + Docker 内嵌 DNS resolver：hyperf 容器重启
        # IP 变化时 nginx 能自动重新解析，避免持续 502 需手动 reload
        resolver 127.0.0.11 valid=10s;
        set $hyperf_upstream http://hyperf:9501;
        proxy_pass $hyperf_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }
}
