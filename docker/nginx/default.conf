server {
    listen 80;
    server_name _;

    # LiteWAF：访问阶段检查（CC 限流 + 攻击特征），白名单/统计页跳过逻辑在 LiteWAF/lua/litewaf.lua
    access_by_lua_file /usr/local/openresty/nginx/lua/waf.lua;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

limit_req_zone $binary_remote_addr zone=logshare_api:10m rate=30r/s;

server {
    listen 443 ssl;
    server_name api.example.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    client_max_body_size 210m;
    client_body_timeout 30s;
    send_timeout 300s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # LiteWAF：访问阶段检查（CC 限流 + 攻击特征）
    access_by_lua_file /usr/local/openresty/nginx/lua/waf.lua;

    # LiteWAF 公开安全统计页（HTML：/security，JSON：/security/stats）
    location = /security {
        content_by_lua_file /usr/local/openresty/nginx/lua/stats.lua;
    }

    location = /security/stats {
        content_by_lua_file /usr/local/openresty/nginx/lua/stats.lua;
    }

    # 手输 /security/（带尾斜杠）时统一跳转到统计页
    location = /security/ {
        return 301 /security;
    }

    location / {
        limit_req zone=logshare_api burst=60 nodelay;
        proxy_pass http://hyperf:9501;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }
}
