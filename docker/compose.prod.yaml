# 生产部署编排（Docker Compose）
#
# 与 docker/compose.yaml 的区别：
#   1. 完整业务配置通过挂载项目根的 Config.inc.php 注入容器
#      （含主推理密钥、双供应商语义 RAG、生产域名 urls 等），
#      env 仅保留容器网络寻址（DB_*/REDIS_*），不再覆盖 AI 配置。
#   2. Config.inc.php 含密钥，已被 .gitignore/.dockerignore 排除——
#      上线前手动把它放到服务器项目根目录即可，切勿提交进 Git。
#
# 用法（在服务器上，项目根目录）：
#   docker compose -f docker/compose.prod.yaml up -d --build
#
# 首次部署注意：mariadb-init.sql 仅在 mariadb-data 卷为空时自动执行；
# 复用旧数据卷需手动建表。rag:build 在 hyperf 启动时自动重建索引。

services:
  nginx:
    image: nginx:latest
    container_name: mclogs-nginx
    ports:
      - "9300:9300"
    volumes:
      - ./mclogs.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - hyperf
    networks:
      - mclogs-network
    restart: unless-stopped

  hyperf:
    container_name: mclogs-hyperf
    build:
      context: ..
      dockerfile: docker/hyperf.Dockerfile
      args:
        SWOOLE_VERSION: ${SWOOLE_VERSION:-6.2.0}
    volumes:
      # 完整业务配置（AI 密钥 / 双供应商语义 RAG / urls 生产域名）只存在于服务器本地
      - ../Config.inc.php:/app/Config.inc.php:ro
      - ./mappings:/app/mappings
    environment:
      APP_ENV: prod
      SCAN_CACHEABLE: "true"
      # 容器网络寻址（会覆盖挂载配置中的 host/port；密码留空则沿用文件值）
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: logshare
      DB_USERNAME: logshare
      DB_PASSWORD: ${MARIADB_PASSWORD:-logshare}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      - mariadb
      - redis
    networks:
      - mclogs-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit((int) (@file_get_contents('http://127.0.0.1:9501/v1/limits', false, stream_context_create(['http' => ['timeout' => 3]])) === false));"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  mariadb:
    image: mariadb:11
    container_name: mclogs-mariadb
    environment:
      MARIADB_DATABASE: logshare
      MARIADB_USER: logshare
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-logshare}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./mariadb-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - mclogs-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 6

  redis:
    image: redis:7-alpine
    container_name: mclogs-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --requirepass "$$REDIS_PASSWORD"; else exec redis-server; fi'
    volumes:
      - redis-data:/data
    networks:
      - mclogs-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  redis-data:
  mariadb-data:

networks:
  mclogs-network:
    name: mclogs-network
