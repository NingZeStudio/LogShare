services:
  nginx:
    image: nginx:latest
    container_name: mclogs-nginx
    ports:
      - "9300:9300"
    volumes:
      - ../:/web/mclogs
      - ./mclogs.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - hyperf
    networks:
      - mclogs-network

  hyperf:
    container_name: mclogs-hyperf
    build:
      context: .
      dockerfile: hyperf.Dockerfile
    volumes:
      - ../:/app
      - spinyarn-mappings:/app/mappings
    environment:
      APP_ENV: prod
      SCAN_CACHEABLE: "true"
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: logshare
      DB_USERNAME: logshare
      DB_PASSWORD: logshare
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      - mariadb
      - redis
    networks:
      - mclogs-network
    restart: unless-stopped

  mariadb:
    image: mariadb:11
    container_name: mclogs-mariadb
    environment:
      MARIADB_DATABASE: logshare
      MARIADB_USER: logshare
      MARIADB_PASSWORD: logshare
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./mariadb-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - mclogs-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mclogs-redis
    volumes:
      - redis-data:/data
    networks:
      - mclogs-network
    restart: unless-stopped

volumes:
  redis-data:
  mariadb-data:
  spinyarn-mappings:

networks:
  mclogs-network:
    name: mclogs-network
