services:
  nginx:
    # OpenResty = Nginx + lua-nginx-module，LiteWAF（../LiteWAF/）运行其上；
    # 版本固定，升级时同步检查 LiteWAF/nginx/nginx.conf 与镜像内置配置的差异
    image: openresty/openresty:1.27.1.2-alpine
    container_name: logshare-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      # LiteWAF：主配置（http 级 lua 指令）与 Lua 模块，详见 LiteWAF/README.md
      - ../LiteWAF/nginx/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ../LiteWAF/lua:/usr/local/openresty/nginx/lua:ro
      - ./certs:/etc/letsencrypt:ro
      - ./acme:/var/www/acme:ro
    depends_on:
      - hyperf
    networks:
      - logshare-network
    restart: unless-stopped
    healthcheck:
      # 探测 /security（nginx Lua 直接响应，不依赖 hyperf）。
      # 探测会使 LiteWAF 累计请求计数每 30s +1，属预期行为
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://127.0.0.1/security"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  acme:
    image: certbot/certbot:v2.11.0
    container_name: logshare-acme
    volumes:
      - ./certs:/etc/letsencrypt:rw
      - ./acme:/var/www/acme:rw
    networks:
      - logshare-network
    entrypoint: /bin/sh
    command: -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/acme --quiet; sleep 12h & wait $${!}; done'
    restart: unless-stopped

  hyperf:
    container_name: logshare-hyperf
    build:
      context: ..
      dockerfile: docker/hyperf.Dockerfile
      args:
        SWOOLE_VERSION: ${SWOOLE_VERSION:-6.2.0}
    expose:
      - "9501"
    volumes:
      - ../mappings:/app/mappings
      # 完整业务配置（AI 密钥、语义 RAG、生产域名等）挂载到容器内，
      # 文件不存在时自动回退 Config.inc.example.php；该文件已被 .gitignore 排除
      - ../Config.inc.php:/app/Config.inc.php:ro
      - ../.env:/app/.env:ro
    environment:
      APP_ENV: prod
      SCAN_CACHEABLE: "true"
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: logshare
      DB_USERNAME: logshare
      DB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    depends_on:
      - mariadb
      - redis
    networks:
      - logshare-network
    restart: unless-stopped
    healthcheck:
      # 容器内不依赖 curl，用 PHP 本体探测 HTTP 端口；显式 3s 网络超时，
      # 避免服务 hang 时探针阻塞到 PHP 默认 socket 超时
      test: ["CMD", "php", "-r", "exit((int) (@file_get_contents('http://127.0.0.1:9501/v1/limits', false, stream_context_create(['http' => ['timeout' => 3]])) === false));"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  mariadb:
    image: mariadb:11
    container_name: logshare-mariadb
    command: --event-scheduler=ON
    environment:
      MARIADB_DATABASE: logshare
      MARIADB_USER: logshare
      # 生产部署请通过宿主机环境变量覆盖默认密码
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD must be set}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD must be set}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./mariadb-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - logshare-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized && mariadb -uroot -p\"$$MARIADB_ROOT_PASSWORD\" -Nse \"SELECT COUNT(*) = 1 FROM information_schema.EVENTS WHERE EVENT_SCHEMA = 'logshare' AND EVENT_NAME = 'cleanup_expired_logs' AND STATUS = 'ENABLED'\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  mariadb-events:
    image: mariadb:11
    container_name: logshare-mariadb-events
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      until mariadb-admin ping -hmariadb -uroot -p"$$MARIADB_ROOT_PASSWORD" --silent;
      do sleep 2; done;
      mariadb -hmariadb -uroot -p"$$MARIADB_ROOT_PASSWORD" logshare < /mariadb-events.sql;
      while :; do sleep 86400; done
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD must be set}
    volumes:
      - ./mariadb-events.sql:/mariadb-events.sql:ro
    depends_on:
      - mariadb
    networks:
      - logshare-network
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: logshare-redis
    # 与 hyperf 的 REDIS_PASSWORD 保持一致，始终启用 requirepass
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command: sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis-data:/data
    networks:
      - logshare-network
    restart: unless-stopped
    healthcheck:
      # 启用 requirepass 后未认证的 ping 会收到 NOAUTH，探测必须携带密码
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  redis-data:
    name: logshare-redis-data
  mariadb-data:
    name: logshare-mariadb-data

networks:
  logshare-network:
    name: logshare-network
