services:
  nginx:
    image: nginx:latest
    container_name: mclogs-nginx
    ports:
      - "9300:9300"
    volumes:
      - ../:/web/mclogs
      - ./mclogs.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php-fpm
    networks:
      - mclogs-network
    # Upload size is enforced in layers:
    #   nginx  client_max_body_size 210m (see mclogs.conf) → transport ceiling
    #   php    post_max_size 16M (see mclogs.ini)          → fastcgi ceiling
    #   app    storage.maxLength 10MB (Config.inc.php)      → business limit

  php-fpm:
    container_name: mclogs-php
    build:
      dockerfile_inline: |
        FROM php:8.5-fpm
        COPY --from=mlocati/php-extension-installer /usr/bin/install-php-extensions /usr/local/bin/
        RUN install-php-extensions mongodb redis
        COPY mclogs.ini /usr/local/etc/php/conf.d/mclogs.ini
    volumes:
      - ../:/web/mclogs
      - ./php-fpm-overrides.conf:/usr/local/etc/php-fpm.d/overrides.conf:ro
    depends_on:
      - mongo
      - redis
    networks:
      - mclogs-network

  mongo:
    image: mongo:latest
    container_name: mclogs-mongo
    volumes:
      - ./mongo-data:/data/db
    networks:
      - mclogs-network

  redis:
    image: redis:7-alpine
    container_name: mclogs-redis
    volumes:
      - redis:/data
    networks:
      - mclogs-network
    restart: unless-stopped

volumes:
  redis:

networks:
  mclogs-network:
    name: mclogs-network