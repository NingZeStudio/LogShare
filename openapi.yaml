  /v1/ai/analyse:
    post:
      tags: [AI]
      summary: Stream AI analysis of raw content
      description: |
        Same as `/v1/ai/{id}` but analyses provided content directly without storage.
        Queue-mode behavior (queued event, 429 on full queue, fail-open) is identical.
        
        When `id` (a stored log ID) is provided, the AI agent gains access to that
        log's files for multi-file comparison; `content` may then be omitted.
        
        When `ai.agent.enabled` is true the endpoint runs the LogAgent tool loop and
        emits additional `event: status` events (`type`: thinking / tool / tool_result / limit)
        alongside the legacy `data:` content lines, `event: error` on failure, and `event: done`
        on completion. Supports request body compression via `Content-Encoding` (br / gzip / deflate).
      operationId: aiAnalyseRawV1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  format: binary
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: Raw log content (optional when `id` is provided)
                id:
                  type: string
                  description: Stored log ID to bind the session to (enables file tools)
                  pattern: '^[a-zA-Z0-9]{7}$'
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: AI service unavailable
        '429':
          $ref: '#/components/responses/RateLimited'
