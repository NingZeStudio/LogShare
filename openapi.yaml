              example: "event: status\ndata: {\"type\":\"queued\",\"position\":1}\n\nevent: status\ndata: {\"type\":\"thinking\",\"delta\":\"Analyzing logs...\"}\n\ndata: {\"choices\":[{\"delta\":{\"content\":\"# Analysis\\n...\"}}]}\n\nevent: done\ndata: {\"status\":\"completed\"}\n\n"
          headers:
            Cache-Control:
              schema:
                type: string
              example: "no-cache"
            Connection:
              schema:
                type: string
              example: "keep-alive"
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: AI service unavailable (no API keys configured)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
