  /1/insights/{id}:
    get:
      tags: [Analysis]
      summary: Get structured insights for a log
      description: |
        Returns parsed entries, error counts, mod list, version info, etc.
        
        (Deprecated; use /v1/insights/{id} instead)
      operationId: getInsights
      deprecated: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9]{7}$'
          example: "aB3x9K"
      responses:
        '200':
          description: Insights data
          content:
