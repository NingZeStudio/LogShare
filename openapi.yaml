  /1/ai/{id}:
    get:
      tags: [AI]
      summary: Stream AI analysis of a stored log
      description: |
        Streams AI-generated analysis (markdown) via SSE. Requires NVIDIA API keys in config.
        Response is `text/event-stream` with `data: <chunk>` lines.
        
        (Deprecated; use /v1/ai/{id} instead)
      operationId: getAIAnalysis
      deprecated: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9]{7}$'
          example: "aB3x9K"
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
              example: "data: ## Analysis\n\ndata: Found 3 errors...\n\ndata: [DONE]\n\n"
          headers:
            Cache-Control:
              schema:
                type: string
              example: "no-cache"
            Connection:
              schema:
                type: string
              example: "keep-alive"
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: AI service unavailable (no API keys configured)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/ai/{id}:
    get:
      tags: [AI]
      summary: Stream AI analysis of a stored log
      description: |
        Streams AI-generated analysis (markdown) via SSE. Response is `text/event-stream`
        with `data: <chunk>` lines.
        
        When `ai.agent.enabled` is true this runs the LogAgent tool loop bound to this
        log ID (file tools `list_log_files` / `read_log_file` / `grep_log_file` are scoped to it) and emits
        additional `event: status` events (`type`: thinking / tool / tool_result / limit) as well as
        `event: error` on failure and `event: done` on completion. Logs <12KB are passed in full; logs >=12KB
        undergo targeted error localization (12KB window around the first error or prompt guidance with
        grep_log_file keywords when no explicit error matches).

        When `ai.queue.enabled` is true the analysis executes in the Redis Streams
        micro-queue and this endpoint only relays the job event stream (an extra
        `event: status` with `{"type":"queued","position":N}` precedes the analysis
        frames). Queue full returns `429` with `Retry-After` before the SSE stream
        starts; a client disconnect does not cancel the job (the result is still
        cached). If Redis is unavailable the request falls back to inline execution
        (`ai.queue.failOpen`).
      operationId: getAIAnalysisV1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9]{7}$'
          example: "aB3x9K"
