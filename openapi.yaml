        '200':
          description: OK
components:
  securitySchemes:
    AdminBearerAuth:
      type: http
      scheme: bearer
    AdminHeaderAuth:
      type: apiKey
      in: header
      name: X-Admin-Token
  schemas:
    IndexResponse:
      type: object
      required: [success, message, endpoints]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "LogShare API"
        endpoints:
          type: array
          items:
            type: string
    LogCreateResponse:
      type: object
      required: [success, message, id, url, raw, token]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Log submitted successfully"
        id:
          type: string
          pattern: '^[a-zA-Z0-9]{7}$'
          example: "aB3x9K"
        url:
          type: string
          format: uri
          example: "https://logshare.cn/aB3x9K"
        raw:
          type: string
          format: uri
          example: "https://api.logshare.cn/1/raw/aB3x9K"
        token:
          type: string
          pattern: '^[a-zA-Z0-9]{16}$'
          example: "k7m2N9pQ4vL1xY6z"
    LogDeleteResponse:
      type: object
      required: [success, message, deleted, failed, total, deletedCount, failedCount]
      properties:
        success:
          type: boolean
        message:
          type: string
        deleted:
          type: array
          items:
            type: string
        failed:
          type: array
          items:
            type: object
            required: [id, message, code]
            properties:
              id:
                type: string
              message:
                type: string
              code:
                type: integer
        total:
          type: integer
        deletedCount:
          type: integer
        failedCount:
          type: integer
    AnalysisResponse:
      type: object
      description: Full Codex analysis result (varies by log type)
      properties:
        success:
          type: boolean
        message:
          type: string
        analysis:
          type: object
          additionalProperties: true
    InsightsResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            lineCount:
              type: integer
            errorCount:
              type: integer
            version:
              type: string
            modLoader:
              type: string
            mods:
              type: array
              items:
                type: object
            entries:
              type: array
              items:
                type: object
    LimitsResponse:
      type: object
      required: [maxLength, maxLines, storageTime]
      properties:
        maxLength:
          type: integer
          description: Max upload bytes
          example: 10485760
        maxLines:
          type: integer
          example: 50000
        storageTime:
          type: integer
          description: TTL in seconds
          example: 604800
    FiltersResponse:
      type: object
      required: [success, filters]
      properties:
        success:
          type: boolean
        filters:
          type: array
          items:
            type: object
            required: [type, data]
            properties:
              type:
                type: string
              data:
                nullable: true
    RateLimitResponse:
      type: object
      required: [success, message, limits]
      properties:
        success:
          type: boolean
        message:
          type: string
        limits:
          type: object
          additionalProperties:
            type: object
            required: [limit, window, remaining, reset]
            properties:
              limit:
                type: integer
              window:
                type: integer
                description: Window in seconds
              remaining:
                type: integer
              reset:
                type: integer
                description: Unix timestamp
    MetadataEntry:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
          maxLength: 100
        value:
          type: string
          maxLength: 500
    ErrorResponse:
      type: object
      required: [success, error, code]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
        code:
          type: integer
        errors:
          type: array
          items:
            type: object
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Missing required field: content"
            code: 400
    Unauthorized:
      description: Missing or invalid Authorization header
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Missing token in Authorization header. Use: Bearer <token>"
            code: 401
    Forbidden:
      description: Token mismatch
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Invalid token for log: aB3x9K"
            code: 403
    NotFound:
      description: Log not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Log not found: aB3x9K"
            code: 404
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until reset
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Rate limit exceeded. Please try again later."
            code: 429
    PayloadTooLarge:
      description: Request body exceeds limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Request body exceeds 10 MB limit"
            code: 413
