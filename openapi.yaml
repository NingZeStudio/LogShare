openapi: 3.1.0
info:
  title: LogShare API
  version: 1.8.2-beta.2
  description: |
    Minecraft / Hytale log analysis and sharing platform.
    
    ## Authentication
    
    Most endpoints are public. Log deletion requires a Bearer token returned on creation.
    
    ## Rate Limiting
    
    All endpoints are rate limited per IP (default: 36,000 requests/minute).
    Exceeding returns `429 Too Many Requests` with `Retry-After` header.
    
    ## Content Filtering
    
    All submitted logs are pre-filtered for:
    - IPv4/IPv6 addresses (full & compressed)
    - UUIDs (standard, brace, URN formats)
    - Xbox XUIDs (16-digit decimal)
    - Session/auth tokens (JWT, Bearer, access_token)
    - Client/device/instance IDs
    - Minecraft coordinates (BlockPos, Vec3d, command formats)
    - Usernames (Windows/Linux paths, USERNAME=)
    - Access tokens (various JSON keys, headers)
    
    Filters run in the above order. Original content is not stored.
servers:
  - url: https://api.logshare.cn
    description: Production API
  - url: http://localhost:9501
    description: Local Hyperf (direct, dev only)
tags:
  - name: Logs
    description: Log submission, retrieval, deletion
  - name: Analysis
    description: Log analysis and insights
  - name: AI
    description: AI-powered log analysis (requires NVIDIA API keys in config)
  - name: Meta
    description: Limits, filters, rate limit status
  - name: Admin
    description: Administration and system monitoring endpoints (requires admin token)
paths:
  /:
    get:
      tags: [Meta]
      summary: API index
      description: Returns list of all available endpoints
      operationId: getIndex
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexResponse'
              example:
                success: true
                message: "LogShare API"
                endpoints:
                  - "POST /1/log"
                  - "DELETE /1/log/{id}"
                  - "POST /1/analyse"
                  - "GET /1/errors/rate"
                  - "GET /1/limits"
                  - "GET /1/filters"
                  - "GET /1/raw/{id}"
                  - "GET /1/insights/{id}"
                  - "GET /1/ai/{id}"
                  - "POST /1/ai/analyse"
  /1/log:
    post:
      tags: [Logs]
      summary: Submit a log
      description: |
        Accepts raw log content as `application/x-www-form-urlencoded` or `application/json`.
        Supports `br`/`gzip`/`deflate` `Content-Encoding`. Server default responds with Brotli compression when requested.
        
        **Form fields (urlencoded or JSON):**
        - `content` (string, required): Raw log text (max 10 MB, 50k lines)
        - `metadata[]` (array, optional): Array of `{key, value}` objects
        - `source` (string, optional): Free-form source identifier
        
        Returns a log ID and a deletion token. **Save the token** — it cannot be recovered.
        
        (Deprecated; use /v1/log instead)
      operationId: createLog
      deprecated: true
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  format: binary
                  description: Raw log content
                metadata:
                  type: array
                  items:
                    $ref: '#/components/schemas/MetadataEntry'
                source:
                  type: string
                  maxLength: 100
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: Raw log content
                metadata:
                  type: array
                  items:
                    $ref: '#/components/schemas/MetadataEntry'
                source:
                  type: string
                  maxLength: 100
      responses:
        '200':
          description: Log created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogCreateResponse'
              example:
                success: true
                message: "Log submitted successfully"
                id: "aB3x9K"
                url: "https://logshare.cn/aB3x9K"
                raw: "https://api.logshare.cn/1/raw/aB3x9K"
                token: "k7m2N9pQ4vL1xY6z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags: [Logs]
      summary: Delete one or more logs
      description: |
        Requires `Authorization: Bearer <token>` header with the token returned on creation.
        Multiple IDs can be comma-separated in the path: `/1/log/id1,id2,id3`
        
        (Deprecated; use /v1/log instead)
      operationId: deleteLogs
      deprecated: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9]{7}(,[a-zA-Z0-9]{7})*$'
          description: Comma-separated log IDs (7 chars each)
          example: "aB3x9K,xY7z2M"
      headers:
        - name: Authorization
          in: header
          required: true
          description: Bearer token from log creation
          schema:
            type: string
            pattern: '^Bearer [a-zA-Z0-9]{16}$'
          example: "Bearer k7m2N9pQ4vL1xY6z"
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogDeleteResponse'
              example:
                success: true
                message: "Log deletion completed"
                deleted:
                  - "aB3x9K"
                failed: []
                total: 1
                deletedCount: 1
                failedCount: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/log:
    post:
      tags: [Logs]
      summary: Submit a log
      description: |
        Accepts raw log content as `application/x-www-form-urlencoded` or `application/json`.
        Supports `br`/`gzip`/`deflate` `Content-Encoding`. Server default responds with Brotli compression when requested.
        
        **Form fields (urlencoded or JSON):**
        - `content` (string, required): Raw log text (max 10 MB, 50k lines)
        - `metadata[]` (array, optional): Array of `{key, value}` objects
        - `source` (string, optional): Free-form source identifier (e.g. `fcl/1.2.0`, `pojav-glow-worm/3.4.0`)
        
        **Integration Best Practice:**
        Clients and launchers should upload all three parts whenever available: game log (`latest.log`) + crash report (`crash-reports/*.txt`) + launcher log (`launcher.log`), and always provide the `source` identifier so that AI diagnostics can accurately correlate launcher-specific environments and fixes.
        
        Returns a log ID and a deletion token. **Save the token** — it cannot be recovered.
      operationId: createLogV1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  format: binary
                  description: Raw log content
                metadata:
                  type: array
                  items:
                    $ref: '#/components/schemas/MetadataEntry'
                source:
                  type: string
                  maxLength: 100
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: Raw log content (optional when `files` is provided)
                files:
                  type: array
                  description: Additional files stored under the same ID. Each `content` may be plain text or a ZIP archive (auto-expanded when `name` ends with `.zip`). Limits: 200 files / 12MB total after expansion.
                  items:
                    type: object
                    required: [name, content]
                    properties:
                      name:
                        type: string
                        description: File name, may include relative sub-paths
                      content:
                        type: string
                        description: File content or ZIP archive bytes
                metadata:
                  type: array
                  items:
                    $ref: '#/components/schemas/MetadataEntry'
                source:
                  type: string
                  maxLength: 100
      responses:
        '200':
          description: Log created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogCreateResponse'
              example:
                success: true
                message: "Log submitted successfully"
                id: "aB3x9K"
                url: "https://logshare.cn/aB3x9K"
                raw: "https://api.logshare.cn/v1/raw/aB3x9K"
                token: "k7m2N9pQ4vL1xY6z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags: [Logs]
      summary: Delete one or more logs
      description: |
        Requires `Authorization: Bearer <token>` header with the token returned on creation.
        Multiple IDs can be comma-separated in the path: `/v1/log/id1,id2,id3`
      operationId: deleteLogsV1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9]{7}(,[a-zA-Z0-9]{7})*$'
          description: Comma-separated log IDs (7 chars each)
          example: "aB3x9K,xY7z2M"
      headers:
        - name: Authorization
          in: header
          required: true
          description: Bearer token from log creation
          schema:
            type: string
            pattern: '^Bearer [a-zA-Z0-9]{16}$'
          example: "Bearer k7m2N9pQ4vL1xY6z"
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogDeleteResponse'
              example:
                success: true
                message: "Log deletion completed"
                deleted:
                  - "aB3x9K"
                failed: []
                total: 1
                deletedCount: 1
                failedCount: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
