          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
  /1/raw/{id}:
    get:
      tags: [Logs]
      summary: Get raw log content
      description: |
        Returns the original (filtered) log text as `text/plain`
        
        (Deprecated; use /v1/raw/{id} instead)
      operationId: getRawLog
      deprecated: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9]{7}$'
          example: "aB3x9K"
      responses:
        '200':
          description: Raw log content
          content:
            text/plain:
              schema:
                type: string
              example: |
                [12:34:56] [Server thread/INFO]: Starting minecraft server version 1.20.1
                [12:34:56] [Server thread/INFO]: Loading properties
                ...
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /1/raw/{id}/{filename}:
    get:
      tags: [Logs]
      summary: Get a specific additional file of a log
      description: |
        Returns one additional file of a multi-file log as `text/plain`.
        `filename` may contain sub-paths (URL-encoded). Path traversal is rejected.
        
        (Deprecated; use /v1/raw/{id}/{filename} instead)
      operationId: getRawFile
      deprecated: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9]{7}$'
          example: "aB3x9K"
        - name: filename
          in: path
          required: true
          schema:
            type: string
            pattern: '^[^/].*[^/]$'
          example: "crash-reports/crash-01.txt"
      responses:
        '200':
          description: File content
          content:
            text/plain:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/raw/{id}:
    get:
