  /1/ai/{id}:
    get:
      tags: [AI]
      summary: Stream AI analysis of a stored log
      description: |
        Streams AI-generated analysis (markdown) via SSE. Requires NVIDIA API keys in config.
        Response is `text/event-stream` with `data: <chunk>` lines.
        
        (Deprecated; use /v1/ai/{id} instead)
      operationId: getAIAnalysis
      deprecated: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9]{7}$'
          example: "aB3x9K"
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
              example: "data: ## Analysis\n\ndata: Found 3 errors...\n\ndata: [DONE]\n\n"
          headers:
            Cache-Control:
              schema:
                type: string
              example: "no-cache"
            Connection:
              schema:
                type: string
              example: "keep-alive"
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: AI service unavailable (no API keys configured)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/ai/{id}:
    get:
      tags: [AI]
      summary: Stream AI analysis of a stored log
      description: |
        Streams AI-generated analysis (markdown) via SSE. Response is `text/event-stream`
        with `data: <chunk>` lines.
        
        When `ai.agent.enabled` is true this runs the LogAgent tool loop bound to this
        log ID (file tools `list_log_files` / `read_log_file` are scoped to it) and emits
        additional `event: status` events (`type`: thinking / tool / tool_result / limit).
      operationId: getAIAnalysisV1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9]{7}$'
          example: "aB3x9K"
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
              example: "data: ## Analysis\n\ndata: Found 3 errors...\n\ndata: [DONE]\n\n"
          headers:
            Cache-Control:
              schema:
                type: string
              example: "no-cache"
            Connection:
              schema:
                type: string
              example: "keep-alive"
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: AI service unavailable (no API keys configured)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /1/ai/analyse:
    post:
      tags: [AI]
      summary: Stream AI analysis of raw content
      description: |
        Same as `/1/ai/{id}` but analyses provided content directly without storage.
        
        (Deprecated; use /v1/ai/analyse instead)
      operationId: aiAnalyseRaw
      deprecated: true
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  format: binary
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: AI service unavailable
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/ai/analyse:
    post:
      tags: [AI]
      summary: Stream AI analysis of raw content
      description: |
        Same as `/v1/ai/{id}` but analyses provided content directly without storage.
        
        When `id` (a stored log ID) is provided, the AI agent gains access to that
        log's files for multi-file comparison; `content` may then be omitted.
        
        When `ai.agent.enabled` is true the endpoint runs the LogAgent tool loop and
        emits additional `event: status` events (`type`: thinking / tool / tool_result / limit)
        alongside the legacy `data:` content lines.
      operationId: aiAnalyseRawV1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  format: binary
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: Raw log content (optional when `id` is provided)
                id:
                  type: string
                  description: Stored log ID to bind the session to (enables file tools)
                  pattern: '^[a-zA-Z0-9]{7}$'
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: AI service unavailable
        '429':
          $ref: '#/components/responses/RateLimited'
